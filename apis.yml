aid: cour-pharmaceuticals-development
name: Cour Pharmaceuticals Development
description: 'COUR Pharmaceuticals Development Co., Inc. (COUR Pharma) is a privately held,
  clinical-stage biotechnology company founded in 2012 and headquartered in the Chicago area
  (Northbrook/Skokie, Illinois), spun out of research at Northwestern University. COUR develops
  antigen-specific immune tolerance therapies built on its proprietary COUR Nanoparticle (CNP)
  platform: biodegradable polymer nanoparticles of roughly 500 nm carrying about 1% disease-specific
  antigen, which mimic apoptotic bodies so that antigen-presenting cells in the liver and spleen
  re-recognize the antigen as self, deleting pathogenic T cells and expanding regulatory T cells.
  Active clinical programs include CNP-103 for Type 1 Diabetes and CNP-106 for Myasthenia Gravis,
  with earlier work in Primary Biliary Cholangitis and Celiac Disease. COUR is a therapeutics
  developer, not a software or platform company: it publishes no developer program, no public API,
  and no machine-readable API contract of any kind.'
